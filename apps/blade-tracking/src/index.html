<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta name="theme-color" content="#14171c" />
    <meta charset="utf-8" />
    <!-- Apply the stored Dana theme (DanaThemeService: localStorage "dana-theme", html[data-dana-theme]) before first paint. -->
    <script>
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem('dana-theme'); } catch (e) { /* storage may be disabled */ }
        var dark = stored === 'dark' || (stored !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-dana-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Dashboard | Blade Tracking</title>
    <base href="/" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="256x256" href="assets/branding/meshforge-favicon.png" />
</head>
  <body class="h-full">
    <gear-blade-tracking-root></gear-blade-tracking-root>
  </body>
</html>
