server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://meshforge-server:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Lapper Read worker status per machine (Fanuc Variables page). Resolved per request
    # through Docker DNS so this site still starts when the collector isn't running.
    # Only the collector's read-only /machines summary is reachable here (machine ids, worker
    # phase, sample time, queued runs, problem category, scanner online state; no IPs,
    # credentials or error text), never /status or the token-protected macro reads.
    location = /collector/machines {
        limit_except GET {
            deny all;
        }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $lapper_read http://lapper-read:8080;
        proxy_pass $lapper_read/machines;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
