# Serves the Angular build and proxies /api to the API container (same-origin, so no CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  location /api/ {
    proxy_pass http://lapper-api:3333/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed assets can be cached forever; index.html must not be.
  location ~* \.(?:js|css|png|svg|woff2?)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
