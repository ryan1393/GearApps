; Truck Log SAP packing-slip watcher - MACHINE-LOCAL SETTINGS ONLY (reconstruction, NOT original V3)
;
; ROUTE SETTINGS ARE NOT IN THIS FILE. Route names, SAP capture queue names, output printers,
; mode (OFF / TEST / LIVE) and "upload to Truck Log" are set in the Truck Log webpage:
;     Truck Log > Admin > Printing  (packing-slip routes 1-8)
; The watcher fetches them every 60 s and keeps the last good copy in state_dir\route-config.json.
; If Truck Log has never been reached (no cached copy), every route runs as TEST with upload off.
; LIVE in Truck Log prints verified slips to the route's printer; TEST never prints.
;
; This file only holds what belongs to THIS print PC: folders, SumatraPDF, timings, OCR and the
; connection to Truck Log. The old keys live_print_armed, [truck_log] enabled and the route
; name/printer/test_mode/source_queue lines are refused - remove them when upgrading an old INI.
; The installed service reads %ProgramFiles%\TruckLog\PackingSlipWatcher\watcher.ini (copied from
; here on first install; edit that copy afterwards and restart the service).

[watcher]
; Durable accepted-capture queue limit; slow printers/OCR run on a separate worker.
; At this limit capture pauses with QUEUE-FULL: stop SAP submissions and investigate.
max_pending_captures = 500
poll_seconds = 1.5
settle_seconds = 2.0
; Truck Log accepts at most 25 MiB per packing slip.
max_pdf_mb = 25
state_dir = C:\TruckLog\SAPWatcherState
; Per-route folders are derived from the route number:
;   capture_file = <capture_root>\route<N>\capture.pdf
;   incoming / ready / needs_review = <packing_root>\<route folder>\Incoming|Ready|NeedsReview
;   route folders: 1 West-Dock, 2 East-Dock, 3 Receiving-Dock, 4 Tube-Mill-Dock, 5 Forge-Dock,
;                  6 North-Shipping-Dock, 7 Scheduling-Office, 8 DGL
; To override one route's folders add e.g. [route8] with capture_file / incoming / ready / needs_review.
capture_root = C:\TruckLog\CaptureStaging
packing_root = C:\TruckLog\PackingSlips
; SumatraPDF installed by the guard agent (TruckLogPrintAgent); used only for LIVE routes.
sumatra_path = C:\ProgramData\Dana\TruckLogPrintAgent\SumatraPDF.exe
ocr_enabled = no

[truck_log]
; Connection to Truck Log. Used for the route settings (GET /print-agents/packing-slip-routes) and,
; on routes with upload switched on in Truck Log, packing-slip uploads.
api_base = https://trucklog.example/api/v1
; http:// is refused unless allow_http = yes (trusted LAN only; the token is sent in clear text).
allow_http = no
; Expected agent id of the token (checked against /print-agents/setup-check). Must NOT be the guard shack agent id.
agent_id = trucklog-sap-watcher-01
; The token is never stored in this INI. Run SETUP-TRUCK-LOG-UPLOAD.cmd as Administrator to store it.
credential_format = dpapi
; LocalMachine = sealed for this PC so the LocalSystem service can read it; the file ACL allows only
; SYSTEM and Administrators. (CurrentUser cannot be read by the service.)
dpapi_scope = LocalMachine
credential_file = C:\TruckLog\SAPWatcherState\truck-log-upload.credential
; Prefix for sourceCaptureId; defaults to this PC's host name.
source_host =
timeout_seconds = 30
retry_initial_seconds = 30
retry_max_seconds = 900
; no = connect directly (ignore Windows/IE proxy settings); yes = use the system proxy.
use_system_proxy = no
