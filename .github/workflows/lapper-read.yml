name: Lapper Read

on:
  push:
    branches: [main]
    paths:
      - 'apps/lapper-read/**'
      - '.github/workflows/lapper-read.yml'
  pull_request:
    paths:
      - 'apps/lapper-read/**'
      - '.github/workflows/lapper-read.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run regression tests
        run: dotnet test apps/lapper-read/LapperRead.Tests/LapperRead.Tests.csproj --configuration Release
      - name: Build x86 collector
        run: dotnet build apps/lapper-read/LapperRead/LapperRead.csproj --configuration Release -p:Platform=x86
