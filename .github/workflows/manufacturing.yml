name: Manufacturing
on:
  push:
    branches: [main]
    paths: ['manufacturing/**', '.github/workflows/manufacturing.yml']
  pull_request:
    paths: ['manufacturing/**', '.github/workflows/manufacturing.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manufacturing
    env:
      CYPRESS_INSTALL_BINARY: '0'
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: manufacturing/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm test
      - run: npm run test:contracts
      - run: npx nx run-many -t build --projects=gear-app-server,blade-tracking,cutter-builder,greenshed --parallel=2
