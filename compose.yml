name: dana-apps

x-gear-server-image: &gear-server-image
  image: dana-apps-gear-app-server:70.5.0
  pull_policy: never

x-gear-db-environment: &gear-db-environment
  ENVIRONMENT: docker
  NODE_ENV: production
  DATABASE_TYPE: postgres
  DATABASE_HOST: dana-postgres
  DATABASE_PORT: 5432
  DATABASE_USERNAME: ${GEAR_DB_USERNAME:-api}
  DATABASE_PASSWORD: ${GEAR_DB_PASSWORD:?Set GEAR_DB_PASSWORD in .env}
  DATABASE_NAME: ${GEAR_DB_NAME:-GearApps}
  DATABASE_LOGGING_ENABLED: "false"

services:
  dana-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GEAR_DB_USERNAME:-api}
      POSTGRES_PASSWORD: ${GEAR_DB_PASSWORD:?Set GEAR_DB_PASSWORD in .env}
      POSTGRES_DB: ${GEAR_DB_NAME:-GearApps}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DANA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - gear_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GEAR_DB_USERNAME:-api} -d ${GEAR_DB_NAME:-GearApps}"]
      interval: 5s
      timeout: 5s
      retries: 20

  gear-db-bootstrap:
    <<: *gear-server-image
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *gear-db-environment
      DATABASE_SYNCHRONIZE: "false"
      DANA_FRESH_DB_BOOTSTRAP: "YES"
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env (12+ chars)}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?Set SEED_USER_PASSWORD in .env (12+ chars)}
    command: ["node", "dist/apps/server-bootstrap/main.js"]
    depends_on:
      dana-postgres:
        condition: service_healthy

  gear-base-data-bootstrap:
    <<: *gear-server-image
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *gear-db-environment
      DATABASE_SYNCHRONIZE: "false"
    command: ["node", "tools/manufacturing/base-data/import-base-data.mjs", "--bootstrap-only"]
    depends_on:
      gear-db-bootstrap:
        condition: service_completed_successfully

  gear-app-server:
    <<: *gear-server-image
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *gear-db-environment
      DATABASE_SYNCHRONIZE: "false"
      SERVER_PORT: 3333
      LAPPER_TIME_ZONE: ${LAPPER_TIME_ZONE:-America/Indianapolis}
      SCANNER_FTP_HOST: ${SCANNER_FTP_HOST:-}
      SCANNER_FTP_USER: ${SCANNER_FTP_USER:-}
      SCANNER_FTP_PASSWORD: ${SCANNER_FTP_PASSWORD:-}
      SCANNER_FTP_ROOT: ${SCANNER_FTP_ROOT:-181-lapper-scanners}
      PUBLIC_API_BASE_URL: ${GEAR_PUBLIC_API_BASE_URL:-http://localhost:3333}
      PUBLIC_WEB_BASE_URL: ${GEAR_PUBLIC_WEB_BASE_URL:-http://localhost:4200}
      EMAIL_TEMPLATE_DIR: /app/dist/apps/server/assets/templates
      EMAIL_PARTIALS_DIR: /app/dist/apps/server/assets/templates/partials
    ports:
      - "${GEAR_API_PORT:-3333}:3333"
    depends_on:
      gear-base-data-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  lapper-client:
    image: dana-apps-lapper-client:70.5.0
    build:
      context: .
      dockerfile: apps/lapper-client/Dockerfile
    restart: unless-stopped
    ports:
      - "${LAPPER_UI_PORT:-4203}:80"
    depends_on:
      gear-app-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  blade-tracking:
    image: dana-apps-blade-tracking:70.5.0
    build:
      context: .
      dockerfile: apps/blade-tracking/Dockerfile
    restart: unless-stopped
    ports:
      - "${GEAR_BLADE_UI_PORT:-4200}:80"
    depends_on:
      gear-app-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cutter-builder:
    image: dana-apps-cutter-builder:70.5.0
    build:
      context: .
      dockerfile: apps/cutter-builder/Dockerfile
    restart: unless-stopped
    ports:
      - "${GEAR_CUTTER_UI_PORT:-4201}:80"
    depends_on:
      gear-app-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  greenshed:
    image: dana-apps-greenshed:70.5.0
    build:
      context: .
      dockerfile: apps/greenshed/Dockerfile
    restart: unless-stopped
    ports:
      - "${GEAR_GREENSHED_UI_PORT:-4202}:80"
    depends_on:
      gear-app-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FANUC + scanner collector. One container runs a worker for every Active machine saved in
  # Lapper with a FANUC controller IP and an assigned scanner; saving, changing or deactivating a
  # machine starts, restarts or stops its worker. Not started by default:
  #   docker compose --profile collectors up -d --build lapper-read
  lapper-read:
    image: dana-apps-lapper-read:70.5.0
    build:
      context: .
      dockerfile: apps/lapper-read-py/Dockerfile
    profiles: ["collectors"]
    restart: unless-stopped
    command: ["supervise"]
    environment:
      GEARAPPS_API_BASE_URL: http://gear-app-server:3333
      GEARAPPS_API_TOKEN: ${LAPPER_READ_API_TOKEN:-}
      GEARAPPS_API_EMAIL: ${LAPPER_READ_API_EMAIL:-}
      GEARAPPS_API_PASSWORD: ${LAPPER_READ_API_PASSWORD:-}
      LAPPER_SCANNER_INPUT1_PORT: ${LAPPER_READ_SCANNER_PORT:-9004}
      LAPPER_POLL_INTERVAL_MS: ${LAPPER_READ_POLL_INTERVAL_MS:-250}
      LAPPER_DISCOVER_INTERVAL_S: ${LAPPER_READ_DISCOVER_INTERVAL_S:-30}
      TZ: ${LAPPER_TIME_ZONE:-America/Indianapolis}
    ports:
      - "${LAPPER_READ_STATUS_PORT:-8090}:8080"
    volumes:
      - ${LAPPER_READ_FOCAS_DIR:-./apps/lapper-read-py/fanuc}:/opt/fanuc:ro
      - lapper_read_state:/data
    depends_on:
      gear-app-server:
        condition: service_healthy

volumes:
  gear_postgres_data:
    name: ${DANA_POSTGRES_VOLUME_NAME:-dana-apps-gear-postgres}
  lapper_read_state:
