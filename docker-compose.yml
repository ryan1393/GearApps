# GearApps · Lapper — client (nginx) + API (NestJS). Configure the API via .env (see .env.example).
services:
  lapper-api:
    build: { context: ., dockerfile: apps/lapper-api/Dockerfile }
    image: gearapps/lapper-api
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      # Behind nginx the client is same-origin; leave CORS_ORIGINS empty unless kiosks call the API directly.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - lapper-data:/app/tmp # only used when DATABASE_TYPE=better-sqlite3
    restart: unless-stopped

  lapper-client:
    build: { context: ., dockerfile: apps/lapper-client/Dockerfile }
    image: gearapps/lapper-client
    ports:
      - '${LAPPER_PORT:-8080}:80'
    depends_on:
      - lapper-api
    restart: unless-stopped

  # Optional local Postgres:  docker compose --profile postgres up
  # then set DATABASE_TYPE=postgres DATABASE_HOST=postgres DATABASE_USERNAME=gearapps ... in .env
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gearapps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gearapps}
      POSTGRES_DB: ${POSTGRES_DB:-gearapps}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gearapps}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  lapper-data:
  pg-data:
