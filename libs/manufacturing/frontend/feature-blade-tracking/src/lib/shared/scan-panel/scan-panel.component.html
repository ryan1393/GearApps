<div class="gear-scan-step flex gap-4 p-5 sm:p-6">
  <div class="gear-workflow-step-number flex h-10 w-10 shrink-0 items-center justify-center rounded-full font-bold text-white" aria-hidden="true">{{ doneValue ? '✓' : step }}</div>
  <div class="min-w-0 flex-1">
    @if (doneValue) {
      <div class="block text-sm font-bold uppercase tracking-wide text-slate-500">{{ label }}</div>
      <div class="gear-scan-done mt-1 flex flex-wrap items-center justify-between gap-3">
        <strong class="gear-scan-done-value font-mono text-2xl font-black">{{ doneValue }}</strong>
        <button type="button" class="gear-btn gear-btn-secondary" [disabled]="disabled" (click)="reopen.emit()">{{ changeText }}</button>
      </div>
    } @else {
      <label [for]="inputId" class="block text-lg font-bold">{{ label }}</label>
      <p *ngIf="help" class="mt-1 text-sm text-slate-600">{{ help }}</p>
      <div class="mt-4 flex gap-2">
        <input #input [id]="inputId" [attr.data-gear-scan-step]="step" [(ngModel)]="value" (keyup.enter)="submit()" (focus)="selectOnFocus()" autocomplete="off"
          class="gear-input min-w-0 flex-1"
          [placeholder]="placeholder" [disabled]="disabled" />
        <button type="button" (click)="submit()" [disabled]="disabled || !value.trim()"
          class="gear-btn gear-btn-primary">{{ buttonText }}</button>
      </div>
      <ng-content />
    }
  </div>
</div>
