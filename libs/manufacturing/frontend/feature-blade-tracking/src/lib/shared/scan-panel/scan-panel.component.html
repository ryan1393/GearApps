<div class="flex gap-4 p-5 sm:p-6">
  <div class="gear-workflow-step-number flex h-10 w-10 shrink-0 items-center justify-center rounded-full font-bold text-white">{{ step }}</div>
  <div class="min-w-0 flex-1">
    <label [for]="inputId" class="block text-lg font-bold">{{ label }}</label>
    <p *ngIf="help" class="mt-1 text-sm text-slate-600">{{ help }}</p>
    <div class="mt-4 flex gap-2">
      <input #input [id]="inputId" [attr.data-gear-scan-step]="step" [(ngModel)]="value" (keyup.enter)="submit()" autocomplete="off"
        class="gear-input min-w-0 flex-1"
        [placeholder]="placeholder" [disabled]="disabled" />
      <button type="button" (click)="submit()" [disabled]="disabled || !value.trim()"
        class="gear-btn gear-btn-primary">{{ buttonText }}</button>
    </div>
  </div>
</div>
