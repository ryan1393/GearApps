<section class="gear-page gear-admin-page" [class.gear-roll-master-page]="activeTab === 'roll-masters'">
  <header class="gear-page-header" danaPageHeader eyebrow="ADMIN / MASTER DATA" heading="MeshForge Administration" description="Create the reference records that drive Blade Tracking, Cutter Builder, Greenshed, and Lapping. Changes here are shared across every MeshForge frontend."></header>

  <label class="gear-field gear-admin-mobile-section" for="admin-section">Administration section
    <select id="admin-section" class="gear-select" [ngModel]="activeTab" (ngModelChange)="openTabByName($event)">
      <optgroup label="People"><option value="users">Users</option></optgroup>
      <optgroup label="Product"><option value="part-summaries">Part Summaries</option><option value="parts">Parts</option><option value="gearsets">Gearsets</option><option value="roll-masters">Roll Master</option><option value="models">Models</option></optgroup>
      <optgroup label="Equipment"><option value="cycle-tests">Cycle Test Lab</option><option value="machines">Machines</option><option value="lapping-machines">Lapping Machines</option><option value="scanners">Scanners</option><option value="macros">Macros</option><option value="fanuc-variables">Fanuc Variables</option><option value="collector-tokens">Collector Tokens</option></optgroup>
      <optgroup label="Inventory"><option value="trays">Trays</option><option value="containers">Containers</option><option value="locations">Locations</option><option value="cutter-bodies">Cutter Bodies</option></optgroup>
      <optgroup label="System"><option value="access">Roles &amp; Badges</option><option value="launch">Launch Setup</option><option value="dsf-mappings">DSF Mappings</option><option value="label-printers">Label Printers</option><option value="coater-rpa">Coater RPA</option><option value="server-settings">Server Settings</option></optgroup>
    </select>
  </label>
  <nav class="gear-admin-sections" aria-label="Administration sections">
    <section class="gear-admin-section"><h2>People</h2><div class="gear-admin-tabs"><button type="button" [attr.aria-current]="activeTab === 'users' ? 'page' : null" [class.active]="activeTab === 'users'" (click)="setTab('users')">Users</button></div></section>
    <section class="gear-admin-section"><h2>Product</h2><div class="gear-admin-tabs"><button type="button" [attr.aria-current]="activeTab === 'part-summaries' ? 'page' : null" [class.active]="activeTab === 'part-summaries'" (click)="setTab('part-summaries')">Part Summaries</button><button type="button" [attr.aria-current]="activeTab === 'parts' ? 'page' : null" [class.active]="activeTab === 'parts'" (click)="setTab('parts')">Parts</button><button type="button" [attr.aria-current]="activeTab === 'gearsets' ? 'page' : null" [class.active]="activeTab === 'gearsets'" (click)="setTab('gearsets')">Gearsets</button><button type="button" [attr.aria-current]="activeTab === 'roll-masters' ? 'page' : null" [class.active]="activeTab === 'roll-masters'" (click)="setTab('roll-masters')">Roll Master</button><button type="button" [attr.aria-current]="activeTab === 'models' ? 'page' : null" [class.active]="activeTab === 'models'" (click)="setTab('models')">Models</button></div></section>
    <section class="gear-admin-section"><h2>Equipment</h2><div class="gear-admin-tabs"><button type="button" [class.active]="activeTab === 'cycle-tests'" [attr.aria-current]="activeTab === 'cycle-tests' ? 'page' : null" (click)="setTab('cycle-tests')">Cycle Test Lab</button><button type="button" [attr.aria-current]="activeTab === 'machines' ? 'page' : null" [class.active]="activeTab === 'machines'" (click)="setTab('machines')">Machines</button><button type="button" [attr.aria-current]="activeTab === 'lapping-machines' ? 'page' : null" [class.active]="activeTab === 'lapping-machines'" (click)="setTab('lapping-machines')">Lapping Machines</button><button type="button" [class.active]="activeTab === 'scanners'" [attr.aria-current]="activeTab === 'scanners' ? 'page' : null" (click)="setTab('scanners')">Scanners</button><button type="button" [class.active]="activeTab === 'macros'" [attr.aria-current]="activeTab === 'macros' ? 'page' : null" (click)="setTab('macros')">Macros</button><button type="button" [class.active]="activeTab === 'fanuc-variables'" [attr.aria-current]="activeTab === 'fanuc-variables' ? 'page' : null" (click)="setTab('fanuc-variables')">Fanuc Variables</button><button type="button" [class.active]="activeTab === 'collector-tokens'" [attr.aria-current]="activeTab === 'collector-tokens' ? 'page' : null" (click)="setTab('collector-tokens')">Collector Tokens</button></div></section>
    <section class="gear-admin-section"><h2>Inventory</h2><div class="gear-admin-tabs"><button type="button" [attr.aria-current]="activeTab === 'trays' ? 'page' : null" [class.active]="activeTab === 'trays'" (click)="setTab('trays')">Trays</button><button type="button" [attr.aria-current]="activeTab === 'containers' ? 'page' : null" [class.active]="activeTab === 'containers'" (click)="setTab('containers')">Containers</button><button type="button" [attr.aria-current]="activeTab === 'locations' ? 'page' : null" [class.active]="activeTab === 'locations'" (click)="setTab('locations')">Locations</button><button type="button" [attr.aria-current]="activeTab === 'cutter-bodies' ? 'page' : null" [class.active]="activeTab === 'cutter-bodies'" (click)="setTab('cutter-bodies')">Cutter Bodies</button></div></section>
    <section class="gear-admin-section"><h2>System</h2><div class="gear-admin-tabs"><button type="button" [class.active]="activeTab === 'access'" [attr.aria-current]="activeTab === 'access' ? 'page' : null" (click)="setTab('access')">Roles &amp; Badges</button><button type="button" [attr.aria-current]="activeTab === 'launch' ? 'page' : null" [class.active]="activeTab === 'launch'" (click)="setTab('launch')">Launch Setup</button><button type="button" [attr.aria-current]="activeTab === 'dsf-mappings' ? 'page' : null" [class.active]="activeTab === 'dsf-mappings'" (click)="setTab('dsf-mappings')">DSF Mappings</button><button type="button" [attr.aria-current]="activeTab === 'label-printers' ? 'page' : null" [class.active]="activeTab === 'label-printers'" (click)="setTab('label-printers')">Label Printers</button><button type="button" [attr.aria-current]="activeTab === 'coater-rpa' ? 'page' : null" [class.active]="activeTab === 'coater-rpa'" (click)="setTab('coater-rpa')">Coater RPA</button><button type="button" [attr.aria-current]="activeTab === 'server-settings' ? 'page' : null" [class.active]="activeTab === 'server-settings'" (click)="setTab('server-settings')">Server Settings</button></div></section>
  </nav>

  <!-- Each tab is a child route (/admin/<tab>) with its own form, list and notices. -->
  <router-outlet />
</section>
