<gear-admin-feedback [tab]="this" />
<div class="gear-admin-layout">
  <form class="gear-panel gear-admin-form" data-admin-editor (ngSubmit)="createModel()">
    <div class="gear-step-title"><span class="gear-step-number">1</span><span>Create Model</span></div>
    <label class="gear-field">Model Number<input class="gear-input" [(ngModel)]="modelForm.model_number" name="modelNumber" maxlength="100" placeholder="e.g. 174 or S-110" /></label>
    <label class="gear-field">Model Type<input class="gear-input" [(ngModel)]="modelForm.model_type" name="modelType" placeholder="Optional type / family" /></label>
    <button class="gear-btn gear-btn-primary" type="submit" [disabled]="busy">Create Model</button>
  </form>

  <div class="gear-panel gear-admin-list gear-admin-record-grid gear-admin-record-grid-professional">
          <div class="gear-admin-list-header gear-admin-search-header">
      <div>
        <h2>Existing Models</h2>
        <small>{{ filteredModels.length }} shown · {{ models.length }} total</small>
      </div>
      <input
        class="gear-input gear-admin-search-input"
        type="search"
        [(ngModel)]="modelSearch"
        name="adminModelSearch"
        aria-label="Search models"
        placeholder="Search model number or type..."
        autocomplete="off"
      />
    </div>
    <div class="gear-admin-row gear-admin-record-card" data-gear-admin-record-card="model-v20" *ngFor="let model of filteredModels">
      <div class="gear-admin-record-card-body">
        <div class="gear-admin-record-heading">
          <strong class="gear-admin-record-title">{{ modelLabel(model) }}</strong>
          <span class="gear-badge" [danaTone]="model.enabled && model.active ? 'Active' : 'Inactive'">{{ model.enabled && model.active ? 'Active' : 'Inactive' }}</span>
        </div>
        <div class="gear-admin-record-meta">
          <div class="gear-admin-record-field gear-admin-record-field-wide">
            <span class="gear-admin-record-label">Model Type</span>
            <span class="gear-admin-record-value">{{ model.model_type || 'No model type' }}</span>
            <span *ngIf="modelSharesNumber(model)" class="gear-badge" data-tone="warning" title="Another model has this number with a different type. Disable one if they are the same model.">Same number as another model</span>
          </div>
        </div>
        <div class="gear-admin-actions gear-admin-record-actions">
          <button type="button" class="gear-btn gear-btn-secondary" [disabled]="busy" (click)="toggleModelEnabled(model)">{{ model.enabled ? 'Disable' : 'Enable' }}</button>
        </div>
      </div>
    </div>
    <gear-admin-list-state [list]="modelsList" noun="models" [shown]="filteredModels.length" [total]="models.length" (retry)="loadModels()" />
  </div>
</div>
